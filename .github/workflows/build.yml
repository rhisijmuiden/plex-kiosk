name: build

on:
  push:
    branches: [main, test]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release with this tag (e.g. v0.2.0). Leave empty for a test build."
        required: false
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh iso/build-iso.sh rootfs/usr/local/sbin/* rootfs/usr/local/bin/*
      - run: python3 -m py_compile rootfs/usr/local/lib/marquee-admin/*.py rootfs/usr/local/lib/marquee-home/*.py
      - run: for f in rootfs/usr/local/lib/marquee-admin/static/*.js rootfs/usr/local/lib/marquee-home/ui/*.js; do node --check "$f"; done

  install-test:
    # Runs install.sh in a clean Debian 13 container, like the installer's late_command (no systemd running).
    needs: lint
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - run: bash ./install.sh --unattended
      - name: Verify result
        run: |
          set -x
          systemctl is-enabled plex-kiosk.service marquee-admin.service plex-kiosk-flatpak-update.timer
          test "$(systemctl get-default)" = graphical.target
          flatpak info --system tv.plex.PlexHTPC
          id kiosk
          test -f /usr/share/plymouth/themes/marquee/marquee.plymouth
          test -x /usr/local/sbin/plex-kiosk-fallback
          test -x /usr/local/sbin/plex-kiosk-gpu
          /usr/local/sbin/plex-kiosk-gpu
          grep -q OnFailure=plex-kiosk-fallback.service /etc/systemd/system/plex-kiosk.service
          grep -qx 'CapabilityBoundingSet=' /etc/systemd/system/plex-kiosk.service
          grep -qx 'UPDATE_CHECK_HOURS=6' /etc/plex-kiosk/plex-kiosk.conf
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); from gi.repository import Gtk"
          python3 -c "import gi; gi.require_version('WebKit', '6.0'); from gi.repository import WebKit; import evdev"
          test -x /usr/local/bin/marquee-session
          grep -q 'ExecStart=/usr/bin/cage -d -s -- /usr/local/bin/marquee-session' /etc/systemd/system/plex-kiosk.service
          grep -qx 'HOME_SCREEN=yes' /etc/plex-kiosk/plex-kiosk.conf
      - name: Screenshot of the home screen (headless cage)
        continue-on-error: true
        run: |
          apt-get install -y --no-install-recommends grim dbus-daemon dbus-user-session mesa-utils libgl1-mesa-dri
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p -m 0700 $XDG_RUNTIME_DIR
          cat > /tmp/shot.sh <<'EOS'
          export GDK_BACKEND=wayland WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 NO_AT_BRIDGE=1
          python3 /usr/local/lib/marquee-home/launcher.py &
          sleep 20
          grim /tmp/home-screen.png
          kill %1
          EOS
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1 \
            timeout 60 dbus-run-session -- cage -- sh /tmp/shot.sh || true
          ls -l /tmp/home-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-screen
          path: /tmp/home-screen.png
          if-no-files-found: ignore

  iso:
    needs: lint
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xorriso
      - run: iso/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: marquee-iso
          path: build/marquee-*.iso*
          retention-days: 14
      - name: Attach ISO to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must look like v1.2.3"; exit 1; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "Marquee $TAG" --notes-file CHANGELOG.md
          gh release upload "$TAG" build/marquee-*.iso build/marquee-*.iso.sha256 --clobber
