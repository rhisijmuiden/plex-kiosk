# Marquee Plex kiosk configuration. Changes apply after: sudo plex-kiosk restart
KIOSK_USER=kiosk
PLEX_APP_ID=tv.plex.PlexHTPC
# Restart Plex after a nightly Plex update (only when a new version was installed).
RESTART_AFTER_UPDATE=yes
# Web admin
ADMIN_PORT=8080
ADMIN_BIND=0.0.0.0
# Linux group whose members may sign in to the web admin
ADMIN_GROUP=sudo
# Where Marquee itself lives and where it updates from
MARQUEE_DIR=/opt/plex-kiosk
MARQUEE_REPO=https://github.com/rhisijmuiden/plex-kiosk.git
# GPU for the kiosk on PCs with more than one, e.g. /dev/dri/card1 (empty = automatic)
KIOSK_GPU=
