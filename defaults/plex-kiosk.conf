# Marquee Plex kiosk configuration. Changes apply after: sudo plex-kiosk restart
KIOSK_USER=kiosk
PLEX_APP_ID=tv.plex.PlexHTPC
# Restart Plex after a nightly Plex update (only when a new version was installed).
RESTART_AFTER_UPDATE=yes
# Web admin
ADMIN_PORT=8080
ADMIN_BIND=0.0.0.0
# Linux group whose members may sign in to the web admin
ADMIN_GROUP=sudo
# Automatic update check: every N hours (0 = off). When something new is found,
# a popup on the TV offers "Update now" / "Later" (waits while media is playing).
UPDATE_CHECK_HOURS=6
UPDATE_POPUP=yes
# Language on the TV (home screen and popup): en or nl
KIOSK_LANG=en
# Where Marquee itself lives and where it updates from
MARQUEE_DIR=/opt/plex-kiosk
MARQUEE_REPO=https://github.com/rhisijmuiden/plex-kiosk.git
# TV home screen to choose an app (no = open Plex directly, like before 0.4.0)
HOME_SCREEN=yes
# Apps on the home screen, in this order, comma separated. Available: plex, noflix (once installed)
HOME_APPS=plex
# What the TV opens when it starts: home, last (last used app) or plex
HOME_START=home
# NO-Flix server for the optional NO-Flix app (install it on the admin's Home screen page)
NOFLIX_SERVER=
# GPU for the kiosk on PCs with more than one, e.g. /dev/dri/card1 (empty = automatic)
KIOSK_GPU=
